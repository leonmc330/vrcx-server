name: vrcx

# VRCX served as a web page. Open http://<host>:8080 and log in to VRChat
# through the normal VRCX login screen; the session lives on the volume.
#
# The "engine" service keeps a headless copy of VRCX's own frontend open
# permanently, so friend/location tracking keeps running with no browser tab
# open - it is the real app doing the real work, just not the tab you look at.
# Comment it out (or `docker compose up -d vrcx`) to run without it: login and
# the friend list still work, but live tracking then only runs while you have
# the page open, same as the desktop app while it is running.

services:
    vrcx:
        image: ghcr.io/leonmc330/vrcx-server:latest
        container_name: vrcx
        restart: unless-stopped

        environment:
            TZ: Europe/Paris

        ports:
            - "8080:8080"

        # VRCX.sqlite3, settings.json and the login cookies
        volumes:
            - vrcx-data:/data

        stop_grace_period: 15s

        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
            interval: 30s
            timeout: 5s
            start_period: 15s
            retries: 3

        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

        security_opt:
            - no-new-privileges:true

    vrcx-engine:
        image: ghcr.io/leonmc330/vrcx-server-engine:latest
        container_name: vrcx-engine
        restart: unless-stopped

        environment:
            TZ: Europe/Paris
            VRCX_URL: http://vrcx:8080/

        depends_on:
            vrcx:
                condition: service_healthy

        # Chromium needs real shared memory, not the default 64MB
        shm_size: "1gb"

        stop_grace_period: 10s

        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

        security_opt:
            - no-new-privileges:true

volumes:
    vrcx-data:
        name: vrcx_vrcx-data
