name: vrcx

services:
    mariadb:
        image: mariadb:11
        container_name: vrcx-mariadb
        restart: unless-stopped
        environment:
            TZ: Europe/Paris
            MYSQL_DATABASE: vrcx
            MYSQL_USER: vrcx
            MYSQL_PASSWORD: vrcx
            MYSQL_ROOT_PASSWORD: root
        volumes:
            - vrcx-mariadb:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mariadb", "-uvrcx", "-pvrcx", "-e", "SELECT 1"]
            interval: 10s
            timeout: 5s
            retries: 10
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"
        security_opt:
            - no-new-privileges:true

    vrcx:
        image: ghcr.io/leonmc330/vrcx-server:latest
        container_name: vrcx
        restart: unless-stopped
        environment:
            TZ: Europe/Paris
            MARIADB_HOST: mariadb
            MARIADB_USER: vrcx
            MARIADB_PASSWORD: vrcx
            MARIADB_DATABASE: vrcx
        depends_on:
            mariadb:
                condition: service_healthy
        ports:
            - "8080:8080"
        volumes:
            - vrcx-data:/data
        stop_grace_period: 15s
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
            interval: 30s
            timeout: 5s
            start_period: 15s
            retries: 3
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"
        security_opt:
            - no-new-privileges:true

    vrcx-engine:
        image: ghcr.io/leonmc330/vrcx-server-engine:latest
        container_name: vrcx-engine
        restart: unless-stopped
        environment:
            TZ: Europe/Paris
            VRCX_URL: http://vrcx:8080/
        depends_on:
            vrcx:
                condition: service_healthy
        shm_size: "1gb"
        stop_grace_period: 10s
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"
        security_opt:
            - no-new-privileges:true

volumes:
    vrcx-data:
        name: vrcx_vrcx-data
    vrcx-mariadb:
        name: vrcx_mariadb-data
